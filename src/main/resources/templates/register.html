<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — MelodyLogin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♫</text></svg>">
</head>
<body>
    <div class="music-particles"></div>
    <div class="sound-waves"></div>
    <div class="auth-container">
        <div class="auth-card" style="width:480px;">
            <div class="auth-header">
                <div class="vinyl-logo" style="width:70px;height:70px;">
                    <div class="vinyl-disc"><div class="vinyl-label" style="width:28px;height:28px;font-size:12px;">♫</div></div>
                </div>
                <h1 style="font-size:20px;">创建账号</h1>
                <p class="subtitle">加入音乐世界 · 开启旋律之旅</p>
            </div>

            <div th:if="${msg != null}" class="msg-box error">
                <span th:text="${msg}">消息</span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" name="username" placeholder="3-20位字母、数字或中文" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>昵称（选填）</label>
                    <div class="input-wrap">
                        <span class="icon">✏️</span>
                        <input type="text" name="nickname" placeholder="给自己取个响亮的名字">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" name="password" placeholder="至少6位密码" required id="regPwd">
                        <button type="button" class="toggle-pwd" onclick="togglePwd(this)">👁️</button>
                    </div>
                    <div id="pwdStrength" style="height:3px;border-radius:3px;background:rgba(255,255,255,0.05);margin-top:6px;overflow:hidden;">
                        <div id="pwdFill" style="height:100%;width:0%;border-radius:3px;transition:all 0.3s;"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>邮箱（选填，用于找回密码）</label>
                    <div class="input-wrap">
                        <span class="icon">📧</span>
                        <input type="email" name="email" placeholder="example@email.com">
                    </div>
                </div>
                <button type="submit" class="btn-primary">♫ 创建账号</button>
            </form>
            <div class="auth-footer">
                <p>已有账号? <a th:href="@{/login}">立即登录</a></p>
            </div>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
