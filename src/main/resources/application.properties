# ==========================================
# MelodyLogin - 应用配置
# ==========================================

# 应用名称
spring.application.name=music-login

# ===== MySQL 数据库配置 =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/music_login_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456

# ===== JPA / Hibernate 配置 =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Thymeleaf 模板引擎 =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== 服务器端口 =====
server.port=8081


# =============================================================
# 📧 邮箱配置（用于找回密码）
# =============================================================
# 使用前请完成以下步骤：
#   1️⃣ 选择下方的一种邮箱，取消对应代码块的注释
#   2️⃣ 将 username 改为你的真实邮箱
#   3️⃣ 将 password 改为授权码（不是登录密码）
#   4️⃣ 重启项目，找回密码功能即可实际发送邮件
# =============================================================


# ========== 方案一：QQ邮箱（推荐）==========
# 如何获取授权码：
#   登录 QQ邮箱 → 设置 → 账户 → POP3/IMAP/SMTP服务 → 开启
#   → 生成授权码 → 复制16位授权码粘贴到下方 password
#
#spring.mail.host=smtp.qq.com
#spring.mail.port=587
#spring.mail.username=你的QQ号@qq.com
#spring.mail.password=你的16位授权码


# ========== 方案二：163邮箱（网易）==========
# 如何获取授权码：
#   登录 163邮箱 → 设置 → POP3/SMTP/IMAP → 开启
#   → 新增授权码 → 复制粘贴到下方 password
#
#spring.mail.host=smtp.163.com
#spring.mail.port=25
#spring.mail.username=你的163邮箱@163.com
#spring.mail.password=你的授权码


# ========== 方案三：Gmail（谷歌）==========
# 注意：需要科学上网，且需开启"允许不够安全的应用"或使用应用密码
# 获取应用密码：Google账号 → 安全性 → 应用密码
#
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=你的邮箱@gmail.com
#spring.mail.password=你的应用密码


# ========== 方案四：Outlook / Hotmail ==========
# 获取密码：Outlook设置 → 查看所有Outlook设置 → 邮件 → 同步邮件 → 开启SMTP
#
#spring.mail.host=smtp-mail.outlook.com
#spring.mail.port=587
#spring.mail.username=你的邮箱@outlook.com
#spring.mail.password=你的密码


# ========== 方案五：其他任意邮箱 ==========
# 搜索 "[你的邮箱服务商] SMTP 服务器地址" 获取 host 和 port
#
#spring.mail.host=你的SMTP服务器地址
#spring.mail.port=你的SMTP端口
#spring.mail.username=你的邮箱
#spring.mail.password=你的密码/授权码


